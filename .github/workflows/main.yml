name: Build Custom OpenWrt

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build'
        required: false
        default: false
        type: boolean
        
      ignore_vermagic:
        description: 'Ignore vermagic'
        required: false
        default: false
        type: boolean
          
  schedule:
    - cron: '0 0 * * 0'     # Опционально: автоматическая сборка каждое воскресенье в 00:00

env:
  VERSION_FILE: .openwrt_version

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
      latest_tag: ${{ steps.get_latest.outputs.latest_tag }}
      version: ${{ steps.get_latest.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Failed check
        run: |
          set -euo pipefail
          echo "Test Case 4: Middle Command in Pipeline Fails with set -o pipefail"
          
          # A pipeline where the middle command fails
          # echo "First Command" | unknown_command | echo "Second Command" | grep "Command" | awk "{print \$2}"
          ls -la release/ || true
          # Code to handle exit status of the pipeline
          if [ $? -ne 0 ]; then
              echo "If exit status is not 0, this line is printed."
          fi
          
          echo "This line is executed even after a pipeline failure."

      - name: Get latest tag
        id: get_latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/openwrt/openwrt/releases/latest | jq -r '.tag_name')
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag is $TAG"

          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version is $VERSION"

      - name: Check version
        id: check
        run: |
          if [ -f "$VERSION_FILE" ]; then
            CURRENT=$(cat $VERSION_FILE)
          else
            CURRENT=""
          fi
          
          echo "Current tag is $CURRENT"
          
          LATEST="${{ steps.get_latest.outputs.latest_tag }}"
          if [ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "Let's build new image!"
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "New version not found. Nothing to build..."
          fi

  create_strategy:
    needs: check-version
    if: needs.check-version.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - id: set-matrix
        run: |
          set -euo pipefail
      
          items=()

          cd DEVICES
      
          for d in */; do
            d=${d%/}
            [ -d "$d" ] || continue
      
            # Optional name filter, e.g.:
            # [[ "$d" == *ax* ]] || continue
      
            # Device MUST have default.config to be included
            if [ ! -f "$d/default.config" ]; then
              echo "⚠️  No default.config in $d – skipping device"
              continue
            fi
      
            patch_files=()
            for p in "$d"/*.patch; do
              [ -f "$p" ] || continue

              # Get file size in bytes
              size=$(wc -c < "$p" | tr -d '[:space:]')
      
              # Skip if size <= 2 bytes
              if [ "$size" -le 2 ]; then
                echo "⚠️  Patch file too small (${size} bytes): $p – skipping"
                continue
              fi
        
              patch_files+=("$p")
            done
      
            if [ "${#patch_files[@]}" -eq 0 ]; then
              # No patches, but config exists → add device without patch
              echo "✅ Adding device without patch: $d"
              items+=("{\"device\":\"$d\",\"patch\":null,\"config\":\"default.config\"}")
            else
              # One or more patches → add one entry per patch
              for p in "${patch_files[@]}"; do
                patch_name=$(basename "$p" .patch)
                echo "✅ Adding: device=$d patch=$patch_name"
                items+=("{\"device\":\"$d\",\"patch\":\"$patch_name\",\"config\":\"default.config\"}")
              done
            fi
          done
      
          if [ "${#items[@]}" -eq 0 ]; then
            echo "⚠️  No device combinations found"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
      
          json=$(printf '%s\n' "${items[@]}" | jq -s -c '.')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Final strategy matrix:"
          echo "$json"
          
  build:
    needs: [check-version, create_strategy]
    if: needs.check-version.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.create_strategy.outputs.matrix) }}
      fail-fast: false
    outputs:
      device: ${{ steps.build-variant.outputs.device }}
      patch: ${{ steps.build-variant.outputs.patch }}
    permissions:
      contents: write        # Необходимо для создания Release

    steps:

    - name: Show build variant
      id: build-variant
      run: |
        echo "Device: ${{ matrix.device }}"
        echo "Patch:  ${{ matrix.patch }}"
        echo "Config: ${{ matrix.config }}"

        echo "device=${{ matrix.device }}" >> "$GITHUB_OUTPUT"
        echo "patch=${{ matrix.patch }}" >> "$GITHUB_OUTPUT"

    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - uses: actions/checkout@v4
    
    - name: Additional cleanup
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/go
        sudo rm -rf /usr/local/julia*
        sudo rm -rf /usr/local/maven*
        sudo rm -rf /usr/local/miniconda
        sudo rm -rf /usr/local/node*
        sudo rm -rf /usr/local/pypy*
        sudo rm -rf /usr/local/swift*
        sudo rm -rf /usr/local/lib/erlang
        sudo docker system prune -af
        sudo apt clean
        sudo apt autoclean
        df -h
        
    - name: Remove and disable snap
      run: |
        sudo systemctl stop snapd
        sudo systemctl disable snapd
        sudo apt remove --purge -y snapd
        sudo apt-mark hold snapd
        sudo rm -rf /var/lib/snapd
        sudo rm -rf /snap
        df -h

    - name: Install build dependencies
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

    - name: Clone OpenWrt source code by tag
      run: |
        git clone --depth 1 --branch ${{ needs.check-version.outputs.latest_tag }} https://github.com/openwrt/openwrt openwrt

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: Debug workspace and DEVICES folder
      run: |
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        echo "Current dir: $(pwd)"
        
        echo "Top-level contents:"
        ls -la
    
        if [ -d "DEVICES" ]; then
          echo "DEVICES folder exists:"
          ls -la DEVICES
        else
          echo "DEVICES folder does NOT exist at repo root"
        fi
    
        echo "All default.config files in repo:"
        find . -name "default.config" || true
        
    - name: Configure firmware for strategy
      run: |
        DEVICE="${{ matrix.device }}"
        PATCH="${{ matrix.patch }}"
        CONFIG_NAME="${{ matrix.config }}"   # always "default.config"

        CONFIG_PATH="${GITHUB_WORKSPACE}/DEVICES/${DEVICE}/${CONFIG_NAME}"

        echo "Using config: $CONFIG_PATH"
        cp "$CONFIG_PATH" "openwrt/.config"

        cd openwrt

        if [ -n "$PATCH" ] && [ "$PATCH" != "null" ]; then
          PATCH_FILE="${GITHUB_WORKSPACE}/DEVICES/${DEVICE}/${PATCH}.patch"
          echo "✅ Applying patch: $PATCH_FILE"
          git apply "$PATCH_FILE" --allow-empty || true
        else
          echo "⚠️ No patch for this device – skipping patch step"
        fi
        
        echo "📦 Running defconfig to resolve dependencies..."
        make defconfig
        
        echo "📋 Final configuration:"
        cat $CONFIG_PATH

    #- name: Get remote vermagic
    #  id: get_remote_vermagic
    #  run: |
    #    manifest_url="https://downloads.openwrt.org/releases/${{ needs.check-version.outputs.version }}/targets/mediatek/filogic/openwrt-${{ needs.check-version.outputs.version }}-mediatek-filogic.manifest"
    #    echo "📥 Fetching manifest: ${manifest_url}"

    #    manifest_content=$(curl -sSf "$manifest_url") || {
    #      echo "❌ Can't get manifest from ${manifest_url}"
    #    }

    #    remote_vermagic_line=$(echo "$manifest_content" | grep '^kernel -' | head -n1)
    #    remote_vermagic_full=$(echo "$remote_vermagic_line" | awk '{print $3}')
    #    remote_hash=$(echo "$remote_vermagic_full" | grep -oP '[a-f0-9]{32}' | tr -d '[:space:]')

    #    echo "✅ Remote vermagic hash: ${remote_hash}"
    #    echo "remote_hash=$remote_hash" >> "$GITHUB_OUTPUT"

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) download
        make -j$(nproc) V=s

    #- name: Get local vermagic
    #  id: get_local_vermagic
    #  run: |
    #    cd openwrt
    #    local_hash=$(find build_dir/ -name ".vermagic" -exec cat {} + 2>/dev/null | tr -d '[:space:]')
    #    echo "✨ Local vermagic hash:  ${local_hash}"
    #    echo "local_hash=$local_hash" >> "$GITHUB_OUTPUT"

    - name: Compare local and remote vermagics
      id: compare_vermagic
      run: |
        manifest_url="https://downloads.openwrt.org/releases/${{ needs.check-version.outputs.version }}/targets/mediatek/filogic/openwrt-${{ needs.check-version.outputs.version }}-mediatek-filogic.manifest"
        echo "📥 Fetching manifest: ${manifest_url}"

        manifest_content=$(curl -sSf "$manifest_url") || {
          echo "❌ Can't get manifest from ${manifest_url}"
        }

        remote_vermagic_line=$(echo "$manifest_content" | grep '^kernel -' | head -n1)
        remote_vermagic_full=$(echo "$remote_vermagic_line" | awk '{print $3}')
        remote_hash=$(echo "$remote_vermagic_full" | grep -oP '[a-f0-9]{32}' | tr -d '[:space:]')

        echo "✅ Remote vermagic hash: ${remote_hash}"
      
        cd openwrt
        local_hash=$(find build_dir/ -name ".vermagic" -exec cat {} + 2>/dev/null | tr -d '[:space:]')
        echo "✨ Local vermagic hash:  ${local_hash}"
        
        # if [ "${{ steps.get_local_vermagic.outputs.local_hash }}" = "${{ steps.get_remote_vermagic.outputs.remote_hash }}" ]; then
        if [ "${local_hash}" = "${remote_hash}" ]; then
          echo "✅ Local and remote vermagics are equal"
          echo "equal=true" >> "$GITHUB_OUTPUT"
        else
          echo "❌ Local and remote vermagics are not equal"
          echo "equal=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Debug workspace
      run: |
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        echo "Current dir: $(pwd)"
        
        echo "Top-level contents:"
        ls -la

        echo "Targets contents:"
        ls -la openwrt/bin/targets/

        echo "Targets contents:"
        ls -la openwrt/bin/targets/mediatek
    
        find . -name "*.ubi" || true

    - name: Detect device from .config
      id: detect-device
      run: |
        set -euo pipefail
    
        CONFIG_FILE="openwrt/.config"  # adjust if your .config is elsewhere
    
        device=""
    
        while IFS= read -r line; do
          # Skip empty lines
          [ -z "$line" ] && continue
    
          # Skip comments (lines starting with #)
          [[ "$line" == \#* ]] && continue
    
          # Skip lines containing "is not set"
          [[ "$line" == *"is not set"* ]] && continue
    
          # Skip lines ending with =n
          [[ "$line" == *=n ]] && continue
    
          # Match lines like:
          # CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_redmi-router-ax6000-stock=y
          # CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y
          if [[ "$line" =~ ^CONFIG_TARGET.*_DEVICE_([^=]+)=y$ ]]; then
            device="${BASH_REMATCH[1]}"
            break
          fi
        done < "$CONFIG_FILE"
    
        if [ -z "$device" ]; then
          echo "⚠️  No device found in $CONFIG_FILE"
          echo "Saving unmatched CONFIG_TARGET..._DEVICE_ lines for debugging:"
          grep -E '^CONFIG_TARGET.*_DEVICE_' "$CONFIG_FILE" > unmatched_device_lines.txt || true
          echo "::warning::No device detected. See unmatched_device_lines.txt in artifacts."
          echo "device=" >> "$GITHUB_OUTPUT"
          exit 1
        fi
    
        echo "✅ Detected device: $device"
        echo "device=$device" >> "$GITHUB_OUTPUT"
    
    - name: Copy firmware files
      if: success()
      run: |
        set -euo pipefail
        
        DEVICE_ID="${{ steps.detect-device.outputs.device }}"
        mkdir -p release
        
        cd openwrt
        echo "🔍 Searching for files matching: *${DEVICE_ID}*"
        #find bin/targets/ -name "*${DEVICE_ID}*" -exec cp {} ../release/ \;
        #find . -type f -name '*.ubi' -exec cp {} ../release/ \;
        #find . -type f -name "*${DEVICE_ID}*" -exec cp {} ../release/ \;

        # Find matching files and copy with new name
        find . -type f -name "*${DEVICE_ID}*" | while IFS= read -r f; do
          base=$(basename "$f")
          # Insert patch info before the last extension
          # e.g. openwrt-...-xiaomi_mi-router-ax3000t-squashfs-factory.bin
          #   -> openwrt-...-xiaomi_mi-router-ax3000t-256mb-squashfs-factory.bin
          name_part="${base%.*}"   # remove last extension
          ext_part="${base##*.}"   # last extension
    
          new_name="${name_part}${SUFFIX}.${ext_part}"
    
          echo "Copying: $f -> ../release/$new_name"
          cp "$f" "../release/$new_name"
        done
        
        echo "✅ Files copied to release/"
        ls -la ../release/ || true

    - name: Add firmware file table to release notes
      run: |
        set -euo pipefail

        cd release
        
        echo "## OpenWrt ${{ needs.check-version.outputs.latest_tag }} Firmware for ${{ matrix.device }} (${{ matrix.patch }})" > "${{ matrix.device }}-${{ matrix.patch }}-report.md"
        echo "" >> "${{ matrix.device }}-${{ matrix.patch }}-report.md"
        
        {
          echo ""
          echo "### Firmware files"
          echo ""
          echo "| File | Size | SHA256 |"
          echo "|------|------|--------|"
    
          for f in *.bin *.itb *.ubi *.img *.manifest; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo "?")
            sha=$(sha256sum "$f" 2>/dev/null | awk '{print $1}' || echo "error")
            echo "| \`${name}\` | ${size} bytes | \`${sha}\` |"
          done
        } >>  "${{ matrix.device }}-${{ matrix.patch }}-report.md"

    - name: Debug workspace
      run: |
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        echo "Current dir: $(pwd)"
        
        echo "Top-level contents:"
        ls -la

        echo "Release contents:"
        ls -la release/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.device }}-${{ matrix.patch }}-${{ needs.check-version.outputs.latest_tag }}
        path: release/

    - name: Debug workspace
      run: |
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        echo "Current dir: $(pwd)"
        
        echo "Top-level contents:"
        ls -la

        echo "Release after upload contents:"
        ls -la release/

  release:
    needs: [check-version, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Debug workspace
        run: |
          set -euo pipefail
          
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Current dir: $(pwd)"
          
          echo "Top-level contents:"
          ls -la
  
          echo "Release after download contents:"
          ls -la release/ || true
          
      - name: Update version
        run: |
          echo "${{ needs.check-version.outputs.latest_tag }}" > $VERSION_FILE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $VERSION_FILE
          git commit -m "New release ${{ needs.check-version.outputs.latest_tag }}" || true
          git push || true

      - name: Aggregate statuses into release/note.md
        run: |
          set -euo pipefail

          cat > release/note.md << 'HEADER'
          ## OpenWrt Firmware Build Report

          HEADER

          echo "Build date: $(date -u)" >> release/note.md
          echo "" >> release/note.md
          echo "### Build results" >> release/note.md
          echo "" >> release/note.md

          # Merge all status files in a stable order
          for f in $(find release -name '*-report.md' | sort); do
            echo "Read content of file: $f"
            cat "$f"
            cat "$f" >> release/note.md
            echo "" >> release/note.md
          done

          # Optionally list firmware files if you also upload them as artifacts
          # echo "### Firmware files" >> release/note.md
          # echo "" >> release/note.md
          # echo "- Firmware binaries are attached as release assets." >> release/note.md

      - name: Set release tag
        id: release_tag
        run: |
          # echo "tag=openwrt-${{ needs.check-version.outputs.latest_tag }}-${{ needs.build.outputs.device }}-${{ needs.build.outputs.patch }}-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          # echo "Release tag: openwrt-${{ needs.check-version.outputs.latest_tag }}-${{ needs.build.outputs.device }}-${{ needs.build.outputs.patch }}-$(date +%Y%m%d-%H%M%S)"
          echo "tag=openwrt-${{ needs.check-version.outputs.latest_tag }}-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "Release tag: openwrt-${{ needs.check-version.outputs.latest_tag }}-$(date +%Y%m%d-%H%M%S)"
      
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.release_tag.outputs.tag }}"
          name: "OpenWrt Firmware"
          body_path: "release/note.md"
          files: |
            release/*.bin
            release/*.itb
            release/*.img
            release/*.ubi
            release/*.manifest
            release/**/*.bin
            release/**/*.itb
            release/**/*.img
            release/**/*.ubi
            release/**/*.manifest
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
