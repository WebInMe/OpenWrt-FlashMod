name: Build Custom OpenWrt

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build'
        required: false
        default: false
        type: boolean
        
      ignore_vermagic:
        description: 'Ignore vermagic'
        required: false
        default: false
        type: boolean
          
  schedule:
    - cron: '0 0 * * 0'     # Опционально: автоматическая сборка каждое воскресенье в 00:00

env:
  VERSION_FILE: .openwrt_version

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
      latest_tag: ${{ steps.get_latest.outputs.latest_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest tag
        id: get_latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/openwrt/openwrt/releases/latest | jq -r '.tag_name')
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag is $TAG"

      - name: Check version
        id: check
        run: |
          if [ -f "$VERSION_FILE" ]; then
            CURRENT=$(cat $VERSION_FILE)
          else
            CURRENT=""
          fi
          
          echo "Current tag is $CURRENT"
          
          LATEST="${{ steps.get_latest.outputs.latest_tag }}"
          if [ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "New version released. Let's build new image!"
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "New version not found. Nothing to build..."
          fi

  create_strategy:
    #needs: check-version
    #if: needs.check-version.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - id: set-matrix
        run: |
          set -euo pipefail

          items=()

          cd DEVICES
          # Scan all ax* folders (adjust pattern if needed)
          for d in */; do
            d=${d%/}  # remove trailing slash

            # Only consider device folders matching ax*
            # [[ "$d" == AX* ]] || continue

            # Find all .patch files in this folder
            patch_files=()
            for p in "$d"/*.patch; do
              [ -f "$p" ] || continue
              patch_files+=("$p")
            done

            # If no patch files, skip this folder entirely
            if [ "${#patch_files[@]}" -eq 0 ]; then
              echo "⚠️  No .patch files in $d – skipping"
              continue
            fi

            # Create one matrix entry per patch file
            for p in "${patch_files[@]}"; do
              patch_name=$(basename "$p" .patch)  # e.g. 256mb
              items+=("{\"device\":\"$d\",\"patch\":\"$patch_name\"}")
            done
          done

          # If nothing found, still output a valid (empty) matrix
          if [ "${#items[@]}" -eq 0 ]; then
            echo "⚠️  No device/patch combinations found"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' "${items[@]}" | jq -s -c '.')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Final strategy matrix:"
          echo "$json"
          
  build:
    needs: [check-version, create_strategy]
    if: needs.check-version.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Необходимо для создания Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
    
    - name: Additional cleanup
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/go
        sudo rm -rf /usr/local/julia*
        sudo rm -rf /usr/local/maven*
        sudo rm -rf /usr/local/miniconda
        sudo rm -rf /usr/local/node*
        sudo rm -rf /usr/local/pypy*
        sudo rm -rf /usr/local/swift*
        sudo rm -rf /usr/local/lib/erlang
        sudo docker system prune -af
        sudo apt clean
        sudo apt autoclean
        df -h
    - name: Remove and disable snap
      run: |
        sudo systemctl stop snapd
        sudo systemctl disable snapd
        sudo apt remove --purge -y snapd
        sudo apt-mark hold snapd
        sudo rm -rf /var/lib/snapd
        sudo rm -rf /snap
        df -h

    - name: Install build dependencies
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

    - name: Get latest tag
      id: get_latest
      run: |
        TAG=$(curl -s https://api.github.com/repos/openwrt/openwrt/releases/latest | jq -r '.tag_name')
        echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

        VERSION="${TAG#v}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Latest tag is $VERSION"

    - name: Clone OpenWrt source code by tag
      run: |
        git clone https://github.com/openwrt/openwrt openwrt
        cd openwrt
        git checkout ${{ steps.get_latest.outputs.latest_tag }}

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure firmware for Xiaomi AX3000T
      run: |
        # cd openwrt
        CONFIG_FILE="openwrt/.config" 
        VERSION="${{ steps.get_latest.outputs.version }}" 
        
        # Проверяем наличие файла конфигурации
        if [ -f "$GITHUB_WORKSPACE/AX3000T/default.config" ]; then
        #if [ -f "ax3000t.config" ]; then
          echo "✅ Using existing config file"
          cp $GITHUB_WORKSPACE/AX3000T/default.config openwrt/.config

          # Replace the repo URL version part
          sed -i "s|CONFIG_VERSION_REPO=\"https://downloads.openwrt.org/releases/[0-9.]*\"|CONFIG_VERSION_REPO=\"https://downloads.openwrt.org/releases/${VERSION}\"|" "$CONFIG_FILE"
          
          #cp ax3000t.config .config
        else
          echo "⚠️ AX3000T default.config not found, generating automatic config"
          # Генерируем базовую конфигурацию для Xiaomi AX3000T
          cat > $CONFIG_FILE << 'EOF'
        # Target configuration for Xiaomi AX3000T
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_xiaomi_mi-router-ax3000t=y
        CONFIG_ALL_KMODS=y
        CONFIG_ALL_NONSHARED=y
        CONFIG_DEVEL=y
        CONFIG_AUTOREMOVE=y
        CONFIG_BUILDBOT=y
        CONFIG_COLLECT_KERNEL_DEBUG=y
        CONFIG_IB=y
        CONFIG_IMAGEOPT=y
        CONFIG_JSON_CYCLONEDX_SBOM=y
        CONFIG_KERNEL_BUILD_DOMAIN="buildhost"
        CONFIG_KERNEL_BUILD_USER="builder"
        # CONFIG_KERNEL_KALLSYMS is not set
        CONFIG_MAKE_TOOLCHAIN=y
        CONFIG_PACKAGE_cgi-io=y
        CONFIG_PACKAGE_e2fsprogs=m
        CONFIG_PACKAGE_f2fsck=m
        CONFIG_PACKAGE_fdisk=m
        CONFIG_PACKAGE_kmod-mt76=y
        CONFIG_PACKAGE_kmod-mt7603=y
        CONFIG_PACKAGE_kmod-mt76x02-common=y
        CONFIG_PACKAGE_kmod-mt76x2=y
        CONFIG_PACKAGE_kmod-mt76x2-common=y
        CONFIG_PACKAGE_kmod-mt7915-firmware=y
        CONFIG_PACKAGE_libblkid=m
        CONFIG_PACKAGE_libcomerr=m
        CONFIG_PACKAGE_libe2p=m
        CONFIG_PACKAGE_libext2fs=m
        CONFIG_PACKAGE_libf2fs=m
        CONFIG_PACKAGE_libfdisk=m
        CONFIG_PACKAGE_liblucihttp=y
        CONFIG_PACKAGE_liblucihttp-ucode=y
        CONFIG_PACKAGE_libncurses=m
        CONFIG_PACKAGE_libsmartcols=m
        CONFIG_PACKAGE_libss=m
        CONFIG_PACKAGE_libuuid=m
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-package-manager=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-light=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-mod-network=y
        CONFIG_PACKAGE_luci-mod-status=y
        CONFIG_PACKAGE_luci-mod-system=y
        CONFIG_PACKAGE_luci-proto-ipv6=y
        CONFIG_PACKAGE_luci-proto-ppp=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_mkf2fs=m
        CONFIG_PACKAGE_mt7981-wo-firmware=m
        CONFIG_PACKAGE_mt7986-wo-firmware=m
        CONFIG_PACKAGE_mt7988-2p5g-phy-firmware=m
        CONFIG_PACKAGE_mt7988-wo-firmware=m
        CONFIG_PACKAGE_partx-utils=m
        CONFIG_PACKAGE_px5g-mbedtls=y
        CONFIG_PACKAGE_rpcd=y
        CONFIG_PACKAGE_rpcd-mod-file=y
        CONFIG_PACKAGE_rpcd-mod-iwinfo=y
        CONFIG_PACKAGE_rpcd-mod-luci=y
        CONFIG_PACKAGE_rpcd-mod-rrdns=y
        CONFIG_PACKAGE_rpcd-mod-ucode=y
        CONFIG_PACKAGE_terminfo=m
        CONFIG_PACKAGE_ucode-mod-html=y
        CONFIG_PACKAGE_ucode-mod-math=y
        CONFIG_PACKAGE_uhttpd=y
        CONFIG_PACKAGE_uhttpd-mod-ubus=y
        CONFIG_PACKAGE_zyxel-bootconfig=m
        CONFIG_REPRODUCIBLE_DEBUG_INFO=y
        CONFIG_SDK=y
        CONFIG_SDK_LLVM_BPF=y
        CONFIG_VERSIONOPT=y
        CONFIG_VERSION_BUG_URL=""
        CONFIG_VERSION_CODE=""
        CONFIG_VERSION_DIST="OpenWrt"
        CONFIG_VERSION_FILENAMES=y
        CONFIG_VERSION_HOME_URL=""
        CONFIG_VERSION_HWREV=""
        CONFIG_VERSION_MANUFACTURER=""
        CONFIG_VERSION_MANUFACTURER_URL=""
        CONFIG_VERSION_NUMBER=""
        CONFIG_VERSION_PRODUCT=""
        CONFIG_VERSION_REPO="https://downloads.openwrt.org/releases/$VERSION"
        CONFIG_VERSION_SUPPORT_URL=""
        EOF

          # Обновляем конфигурацию с разрешением зависимостей
          echo "📦 Running oldconfig to resolve dependencies..."
          cd openwrt
          make defconfig
        fi
        
        # Показываем финальную конфигурацию
        echo "📋 Final configuration:"
        cat $CONFIG_FILE | grep -E "CONFIG_TARGET|CONFIG_DEVEL" || true

    - name: Final configuration
      run: |
        cat openwrt/.config 

    - name: Get remote vermagic
      id: get_remote_vermagic
      run: |
        manifest_url="https://downloads.openwrt.org/releases/${{ steps.get_latest.outputs.version }}/targets/mediatek/filogic/openwrt-${{ steps.get_latest.outputs.version }}-mediatek-filogic.manifest"
        echo "📥 Fetching manifest: ${manifest_url}"

        manifest_content=$(curl -sSf "$manifest_url") || {
          echo "❌ Can't get manifest from ${manifest_url}"
        }

        remote_vermagic_line=$(echo "$manifest_content" | grep '^kernel -' | head -n1)
        remote_vermagic_full=$(echo "$remote_vermagic_line" | awk '{print $3}')
        remote_hash=$(echo "$remote_vermagic_full" | grep -oP '[a-f0-9]{32}' | tr -d '[:space:]')

        echo "✅ Remote vermagic hash: ${remote_hash}"
        echo "remote_hash=$remote_hash" >> "$GITHUB_OUTPUT"

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) download
        make -j$(nproc) V=s

    - name: Get local vermagic
      id: get_local_vermagic
      run: |
        cd openwrt
        local_hash=$(find build_dir/ -name ".vermagic" -exec cat {} + 2>/dev/null | tr -d '[:space:]')
        echo "✅ Local vermagic hash:  ${local_hash}"
        echo "local_hash=$local_hash" >> "$GITHUB_OUTPUT"

    - name: Compare local and remote vermagics
      id: compare_vermagic
      run: |
        if [ "${{ steps.get_local_vermagic.outputs.local_hash }}" = "${{ steps.get_remote_vermagic.outputs.remote_hash }}" ]; then
          echo "✨ Local and remote vermagics are equal"
          echo "equal=true" >> "$GITHUB_OUTPUT"
        else
          echo "❌ Local and remote vermagics are not equal"
          echo "equal=false" >> "$GITHUB_OUTPUT"
        fi
    
    - name: Prepare release artifacts
      if: success()
      run: |
        cd openwrt
        mkdir -p release
        find bin/targets/ -name '*ax3000t*' -exec cp {} release/ \;
        echo "## OpenWrt Firmware for Xiaomi AX3000T" > release/note.md
        echo "Build date: $(date)" >> release/note.md

    - name: Set release tag
      id: release_tag
      run: |
        echo "tag=openwrt-${{ steps.get_latest.outputs.latest_tag }}-ax3000t-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
        echo "Release tag: openwrt-${{ steps.get_latest.outputs.latest_tag }}-ax3000t-$(date +%Y%m%d-%H%M%S)"

    - name: Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "${{ steps.release_tag.outputs.tag }}"
        name: "OpenWrt Firmware for Xiaomi AX3000T"
        body_path: "openwrt/release/note.md"
        files: |
          openwrt/release/*.bin
          openwrt/release/*.itb
          openwrt/release/*.img
          openwrt/release/*.ubi
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Update version
        run: |
          echo "${{ needs.check-version.outputs.latest_tag }}" > $VERSION_FILE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $VERSION_FILE
          git commit -m "New release ${{ needs.check-version.outputs.latest_tag }}" || true
          git push || true

      #- name: Release
      #  uses: softprops/action-gh-release@v1
      #  with:
      #    tag_name: openwrt-${{ needs.check-version.outputs.latest_tag }}-${{ github.run_number }}
      #    name: OpenWrt ${{ needs.check-version.outputs.latest_tag }}
      #    body: Automated build with extended UBI
      #    files: artifacts/**/*
      #    draft: false
      #  env:
      #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
