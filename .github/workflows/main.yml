name: Build OpenWrt for Xiaomi AX3000T

on:
  workflow_dispatch:        # Разрешает ручной запуск сборки
  schedule:
    - cron: '0 0 * * 0'     # Опционально: автоматическая сборка каждое воскресенье в 00:00

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Необходимо для создания Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Maximize build space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 512
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'
    
    - name: Additional cleanup
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/go
        sudo rm -rf /usr/local/julia*
        sudo rm -rf /usr/local/maven*
        sudo rm -rf /usr/local/miniconda
        sudo rm -rf /usr/local/node*
        sudo rm -rf /usr/local/pypy*
        sudo rm -rf /usr/local/swift*
        sudo rm -rf /usr/local/lib/erlang
        sudo docker system prune -af
        sudo apt clean
        sudo apt autoclean
        df -h
    - name: Remove and disable snap
      run: |
        sudo systemctl stop snapd
        sudo systemctl disable snapd
        sudo apt remove --purge -y snapd
        sudo apt-mark hold snapd
        sudo rm -rf /var/lib/snapd
        sudo rm -rf /snap
        df -h

    - name: Install build dependencies
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget
        #sudo apt install -y build-essential clang flex bison g++ gawk \
        #  gcc-multilib gettext git libncurses-dev libssl-dev python3-dev \
        #  python3-pip python3-full python3-venv rsync unzip zlib1g-dev file wget \
        #  time qemu-utils

    - name: Clone OpenWrt source code by tag
      run: |
        git clone https://github.com/openwrt/openwrt openwrt
        cd openwrt
        # Используйте конкретный тег, если нужно (раскомментируйте ниже)
        git checkout tags/v25.12.5

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure firmware for Xiaomi AX3000T
      run: |
        cd openwrt
        # Используем файл .config, подготовленный специально для Xiaomi AX3000T
        # Предполагается, что файл с именем 'ax3000t.config' лежит в корне репозитория
        cp $GITHUB_WORKSPACE/ax3000t.config .config
        # Альтернативно: make defconfig и make menuconfig для более тонкой настройки

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) download
        make -j$(nproc) V=s

    - name: Prepare release artifacts
      if: success()
      run: |
        cd openwrt
        mkdir -p release
        find bin/targets/ -name '*ax3000t*' -exec cp {} release/ \;
        echo "## OpenWrt Firmware for Xiaomi AX3000T" > release/note.md
        echo "Build date: $(date)" >> release/note.md

    - name: Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "openwrt-ax3000t-$(date +'%Y%m%d-%H%M%S')"
        name: "OpenWrt Firmware for Xiaomi AX3000T"
        body_path: "openwrt/release/note.md"
        files: |
          openwrt/release/*.bin
          openwrt/release/*.itb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
