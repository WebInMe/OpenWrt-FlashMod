name: OpenWrt Auto Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build'
        required: false
        default: 'false'
        type: boolean

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  VERSION_FILE: .openwrt_version

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
      latest_tag: ${{ steps.get_latest.outputs.latest_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest tag
        id: get_latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/openwrt/openwrt/releases/latest | jq -r '.tag_name')
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check version
        id: check
        run: |
          if [ -f "$VERSION_FILE" ]; then
            CURRENT=$(cat $VERSION_FILE)
          else
            CURRENT=""
          fi
          LATEST="${{ steps.get_latest.outputs.latest_tag }}"
          if [ "$CURRENT" != "$LATEST" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "has_new=true" >> $GITHUB_OUTPUT
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: [redmi-ax6000, xiaomi-ax3000t]
        flash: [256mb, 512mb]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex gawk g++ gettext git libncurses5-dev libssl-dev python3 quilt rsync subversion swig unzip wget zlib1g-dev jq

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch ${{ needs.check-version.outputs.latest_tag }} ${{ env.REPO_URL }} openwrt

      - name: Apply DTS patch
        run: |
          cd openwrt
          DEVICE="${{ matrix.device }}"
          FLASH="${{ matrix.flash }}"
          
          if [ "$DEVICE" = "redmi-ax6000" ]; then
            if [ "$FLASH" = "256mb" ]; then
              printf '%s\n' '/dts-v1/;' '#include "mt7986a-xiaomi-redmi-router-ax6000.dtsi"' '/' '{' '  model = "AX6000 256MB";' '};' '&partitions {' '  partition@2400000 {' '    label = "ubi";' '    reg = <0x2400000 0x10000000>;' '  };' '};' > target/linux/mediatek/dts/mt7986a-xiaomi-redmi-router-ax6000-ubi-256.dts
            else
              printf '%s\n' '/dts-v1/;' '#include "mt7986a-xiaomi-redmi-router-ax6000.dtsi"' '/' '{' '  model = "AX6000 512MB";' '};' '&partitions {' '  partition@2400000 {' '    label = "ubi";' '    reg = <0x2400000 0x20000000>;' '  };' '};' > target/linux/mediatek/dts/mt7986a-xiaomi-redmi-router-ax6000-ubi-512.dts
            fi
          else
            if [ "$FLASH" = "256mb" ]; then
              printf '%s\n' '/dts-v1/;' '#include "mt7986b-xiaomi-mi-router-ax3000t.dtsi"' '/' '{' '  model = "AX3000T 256MB";' '};' '&partitions {' '  partition@2400000 {' '    label = "ubi";' '    reg = <0x2400000 0x10000000>;' '  };' '};' > target/linux/mediatek/dts/mt7986b-xiaomi-mi-router-ax3000t-ubi-256.dts
            else
              printf '%s\n' '/dts-v1/;' '#include "mt7986b-xiaomi-mi-router-ax3000t.dtsi"' '/' '{' '  model = "AX3000T 512MB";' '};' '&partitions {' '  partition@2400000 {' '    label = "ubi";' '    reg = <0x2400000 0x20000000>;' '  };' '};' > target/linux/mediatek/dts/mt7986b-xiaomi-mi-router-ax3000t-ubi-512.dts
            fi
          fi

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Config
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_ALL_NONSHARED=y" >> .config
          echo "CONFIG_ALL_KMODS=y" >> .config
          echo "CONFIG_AUTOREMOVE=y" >> .config

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Prepare
        run: |
          mkdir -p artifacts
          cp -r openwrt/bin/targets/mediatek/filogic/* artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-${{ matrix.flash }}-${{ needs.check-version.outputs.latest_tag }}
          path: artifacts/

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.has_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update version
        run: |
          echo "${{ needs.check-version.outputs.latest_tag }}" > $VERSION_FILE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $VERSION_FILE
          git commit -m "Update" || true
          git push || true

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: openwrt-${{ needs.check-version.outputs.latest_tag }}-${{ github.run_number }}
          name: OpenWrt ${{ needs.check-version.outputs.latest_tag }}
          body: Automated build with extended UBI
          files: artifacts/**/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
