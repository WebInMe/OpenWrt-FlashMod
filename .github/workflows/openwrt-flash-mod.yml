name: OpenWrt Builder

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific tag to build (e.g., v23.05.3)'
        required: false
        default: ''

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3 python3-distutils python3-pip \
            rsync unzip zlib1g-dev file wget \
            time qemu-utils qemu-user-static \
            u-boot-tools device-tree-compiler
          
      - name: Get latest version
        id: latest_version
        run: |
          LATEST_TAG=$(git ls-remote --tags https://github.com/openwrt/openwrt.git \
            | grep -E 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/.*refs\/tags\///' \
            | sort -V \
            | tail -n1)
          
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Found latest tag: $LATEST_TAG"
          
      - name: Check if new version exists
        id: check_version
        run: |
          LATEST_TAG="${{ steps.latest_version.outputs.latest_tag }}"
          
          mkdir -p .state
          
          if [ -f .state/last_built_tag ]; then
            PREV_TAG=$(cat .state/last_built_tag)
          else
            PREV_TAG=""
          fi
          
          echo "Previous: $PREV_TAG, Latest: $LATEST_TAG"
          
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            LATEST_TAG="${{ github.event.inputs.tag }}"
            echo "build_required=true" >> $GITHUB_OUTPUT
            echo "tag_to_build=$LATEST_TAG" >> $GITHUB_OUTPUT
          elif [ "$LATEST_TAG" != "$PREV_TAG" ] && [ -n "$LATEST_TAG" ]; then
            echo "New version detected!"
            echo "build_required=true" >> $GITHUB_OUTPUT
            echo "tag_to_build=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "No new version"
            echo "build_required=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Clone OpenWrt source
        if: steps.check_version.outputs.build_required == 'true'
        run: |
          TAG="${{ steps.check_version.outputs.tag_to_build }}"
          git clone --branch $TAG --depth 1 --quiet \
            https://github.com/openwrt/openwrt.git openwrt-source
          
      - name: Apply DTS patches
        if: steps.check_version.outputs.build_required == 'true'
        run: |
          cd openwrt-source
          
          # Determine kernel version
          KERNEL_VER=$(ls target/linux/mediatek/patches-* | head -1 | sed 's/.*patches-//')
          PATCH_DIR="target/linux/mediatek/patches-${KERNEL_VER}"
          mkdir -p $PATCH_DIR
          
          # Create patches (only include the essential ones to reduce output)
          cat > $PATCH_DIR/100-redmi-ax6000-ubi-expand.patch << 'EOF'
          --- a/target/linux/mediatek/dts/mt7986a-xiaomi-redmi-ax6000.dts
          +++ b/target/linux/mediatek/dts/mt7986a-xiaomi-redmi-ax6000.dts
          @@ -1,5 +1,6 @@
           // SPDX-License-Identifier: GPL-2.0-or-later OR MIT
          +/dts-v1/;
           
           #include "mt7986a-xiaomi.dtsi"
           
           / {
           @@ -10,6 +11,24 @@
                   };
           };
           
          +&flash {
          +    partitions {
          +        compatible = "fixed-partitions";
          +        #address-cells = <1>;
          +        #size-cells = <1>;
          +
          +        partition@0 {
          +            label = "bl2";
          +            reg = <0x0000000 0x400000>;
          +            read-only;
          +        };
          +
          +        partition@400000 {
          +            label = "ubi";
          +            reg = <0x400000 0x10000000>;
          +        };
          +    };
          +};
           EOF
           
          cat > $PATCH_DIR/101-redmi-ax6000-ubi-512mb.patch << 'EOF'
          --- a/target/linux/mediatek/dts/mt7986a-xiaomi-redmi-ax6000.dts
          +++ b/target/linux/mediatek/dts/mt7986a-xiaomi-redmi-ax6000.dts
          @@ -1,5 +1,6 @@
           // SPDX-License-Identifier: GPL-2.0-or-later OR MIT
          +/dts-v1/;
           
           #include "mt7986a-xiaomi.dtsi"
           
           / {
           @@ -10,6 +11,24 @@
                   };
           };
           
          +&flash {
          +    partitions {
          +        compatible = "fixed-partitions";
          +        #address-cells = <1>;
          +        #size-cells = <1>;
          +
          +        partition@0 {
          +            label = "bl2";
          +            reg = <0x0000000 0x400000>;
          +            read-only;
          +        };
          +
          +        partition@400000 {
          +            label = "ubi";
          +            reg = <0x400000 0x20000000>;
          +        };
          +    };
          +};
           EOF
           
          # Similar patches for Xiaomi AX3000T...
          # [Add 200-xiaomi-ax3000t-ubi-256mb.patch and 201-xiaomi-ax3000t-ubi-512mb.patch here]
          
          echo "Patches applied to $PATCH_DIR"
          
      - name: Build configurations
        if: steps.check_version.outputs.build_required == 'true'
        run: |
          cd openwrt-source
          
          # Quiet feed updates
          ./scripts/feeds update -a > /dev/null 2>&1
          ./scripts/feeds install -a > /dev/null 2>&1
          
          # Create base config
          cat > .config.base << 'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7986=y
          CONFIG_TARGET_mediatek_mt7981=y
          CONFIG_DEVEL=y
          CONFIG_TOOLCHAINOPTS=y
          CONFIG_IMAGEOPT=y
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_DIST="OpenWrt"
          EOF
          
      - name: Build Redmi AX6000 256MB
        if: steps.check_version.outputs.build_required == 'true'
        run: |
          cd openwrt-source
          
          # Use minimal output
          cp .config.base .config
          echo "CONFIG_TARGET_mediatek_mt7986_DEVICE_xiaomi_redmi-ax6000=y" >> .config
          
          make defconfig > /dev/null 2>&1
          make -j$(nproc) download > /dev/null 2>&1
          make -j$(nproc) 2>&1 | tee build.log | grep -E "(Building|Error|WARNING|Done)" || true
          
          mkdir -p ../firmware
          find bin/targets -name "*redmi-ax6000*sysupgrade.bin" -exec cp {} ../firmware/redmi-ax6000-256mb-$(date +%Y%m%d)-${{ steps.check_version.outputs.tag_to_build }}.bin \;
          
          make clean > /dev/null 2>&1
          
      # [Repeat for other variants with similar structure]
      
      - name: Upload artifacts
        if: steps.check_version.outputs.build_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: firmware/
          
      - name: Create Release
        if: steps.check_version.outputs.build_required == 'true'
        uses: softprops/action-gh-release@v1
        with:
          name: "OpenWrt ${{ steps.check_version.outputs.tag_to_build }}"
          tag_name: "build-${{ steps.check_version.outputs.tag_to_build }}-${{ github.run_number }}"
          files: firmware/*.bin
          draft: false
          prerelease: false
