name: OpenWrtMod

on:
  # schedule:
    # Run daily at 02:00 UTC
    # - cron: '0 2 * * *'
  repository_dispatch:
  workflow_dispatch:
    inputs:
      MODEL:
        description: 'Router model'
        required: true
        default: 'AX6000'
        type: choice
        options:
          - AX6000
          - AX3000
      FLASH_SIZE:
        description: 'Flash size'
        required: true
        default: '512MB'
        type: choice
        options:
          - 512MB
          - 256MB
          - 128MB
      REPO_URL:
        description: 'Source repository'
        required: true
        default: 'https://github.com/openwrt/openwrt'
        type: string
      REPO_BRANCH:
        description: 'Repository branch'
        required: true
        default: 'auto'
        type: string

env:
  REPO_URL: ${{ github.event.inputs.REPO_URL }}
  REPO_BRANCH_INPUT: ${{ github.event.inputs.REPO_BRANCH }}
  TZ: UTC
  # Build configuration from inputs
  CONFIG_MODEL: ${{ github.event.inputs.MODEL || 'AX6000'  }}
  CONFIG_FLASH_SIZE: ${{ github.event.inputs.FLASH_SIZE || '512MB' }}

jobs:
  check-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest

    permissions:
      contents: write
      
    outputs:
      new_branch: ${{ steps.check_branch.outputs.new_branch }}
      branch_name: ${{ steps.check_branch.outputs.branch_name }}
      openwrt_version: ${{ steps.get_version.outputs.openwrt_version }}
      version_repo: ${{ steps.get_version.outputs.version_repo }}
    
    steps:
      - name: Get latest OpenWrt release
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'openwrt',
              repo: 'openwrt',
              per_page: 10
            });
            
            // Находим первый релиз, который не является pre-release
            const stable = releases.find(r => !r.prerelease);
            
            if (stable) {
              const tag = stable.tag_name;
              console.log(`Latest stable version: ${tag}`);
              // Сохраняем в outputs
              core.setOutput('tag_name', tag);
              core.setOutput('version', tag.replace(/^v/, ''));
            } else {
              core.setFailed('No stable release found');
            }
            
      - name: Get the latest OpenWrt stable version
        id: get_latest_stable
        uses: joutvhu/get-release@v1
        with:
          repo: openwrt/openwrt
          latest: true
          # This will exclude pre-releases like release candidates
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
          
      - name: Use the version
        run: |
          echo "The latest stable version is ${{ steps.get_latest_stable.outputs.tag_name }}"

          if [ -n "$REPO_BRANCH_IN" ] && [ "$REPO_BRANCH_IN" != "auto" ]; then
            REPO_REF="$REPO_BRANCH_IN"
          else
            REPO_REF="${{ steps.get_latest_stable.outputs.tag_name }}"
          fi

          echo "Using source: $REPO_REF"
        
      
