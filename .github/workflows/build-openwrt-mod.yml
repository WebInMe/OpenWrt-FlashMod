name: OpenWrtMod

on:
  # schedule:
    # Run daily at 02:00 UTC
    # - cron: '0 2 * * *'
  repository_dispatch:
  workflow_dispatch:
    inputs:
      MODEL:
        description: 'Router model'
        required: true
        default: 'AX6000'
        type: choice
        options:
          - AX6000
          - AX3000
      FLASH_SIZE:
        description: 'Flash size'
        required: true
        default: '512MB'
        type: choice
        options:
          - 512MB
          - 256MB
          - 128MB
      REPO_URL:
        description: 'Source repository'
        required: true
        default: 'https://github.com/openwrt/openwrt'
        type: string
      REPO_BRANCH:
        description: 'Repository branch'
        required: true
        default: 'auto'
        type: string

env:
  REPO_URL: ${{ github.event.inputs.REPO_URL }}
  REPO_BRANCH_INPUT: ${{ github.event.inputs.REPO_BRANCH }}
  TZ: UTC
  # Build configuration from inputs
  CONFIG_MODEL: ${{ github.event.inputs.MODEL || 'AX6000'  }}
  CONFIG_FLASH_SIZE: ${{ github.event.inputs.FLASH_SIZE || '512MB' }}

jobs:
  check-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest

    permissions:
      contents: write
      
    outputs:
      new_branch: ${{ steps.check_branch.outputs.new_branch }}
      branch_name: ${{ steps.check_branch.outputs.branch_name }}
      openwrt_version: ${{ steps.get_version.outputs.openwrt_version }}
      version_repo: ${{ steps.get_version.outputs.version_repo }}
    
    steps:  
      # - name: Checkout repository
      #   uses: actions/checkout@v4

      - name: Get latest stable version with git
        id: get_version
        run: |
          git clone --tags https://github.com/openwrt/openwrt.git /tmp/openwrt
          cd /tmp/openwrt
          LATEST_TAG=$(git tag --list 'v*' --sort='-version:refname' | grep -v '\-rc' | head -n1)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "version=${LATEST_TAG#v}" >> $GITHUB_OUTPUT
          
      - name: Use the version
        run: |
          if [ -n "$REPO_BRANCH_IN" ] && [ "$REPO_BRANCH_IN" != "auto" ]; then
            REPO_REF="$REPO_BRANCH_IN"
          else
            REPO_REF="${{ steps.get_version.outputs.tag }}"
          fi

          echo "Using source: $REPO_REF"
          echo "$REPO_REF" > latest.txt
